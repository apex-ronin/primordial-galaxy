name: Oracle A1 Instance Hunter

# RETIRED 2026-06-11 (legacy audit). The Oracle A1 "always-free" hunt was superseded
# by the sovereign-local architecture decision (STATE.md 2026-06-04) and the 2026-06-06
# GCP teardown. The scheduled trigger is disabled so it stops consuming Actions minutes.
# Kept (manual-dispatch only) in case a cloud node is ever needed again. The issue-body
# SSH/Hetzner references below are historical.

on:
  # schedule:
  #   - cron: '*/10 * * * *'   # DISABLED — Oracle hunt retired (see note above)
  workflow_dispatch:          # Manual trigger only

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 3        # Fast exit — keeps GitHub Actions usage minimal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: pip install oci --quiet

      - name: Hunt for A1 instance
        id: hunt
        env:
          OCI_TENANCY_OCID:    ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID:       ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT:     ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY:     ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION:          ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SSH_PUBLIC_KEY:  ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_INSTANCE_NAME:   primordial-galaxy
        run: python scripts/oracle_instance_hunter.py
        continue-on-error: true   # exit 1 (capacity) is not a workflow failure

      - name: Open issue on success
        if: steps.hunt.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const inst = JSON.parse(fs.readFileSync('oracle_instance.json', 'utf8'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: '🎯 Oracle Always-Free A1 Instance Captured',
              body: [
                '## Instance Provisioned',
                '```json',
                JSON.stringify(inst, null, 2),
                '```',
                '',
                '## Next Steps',
                '1. Go to **OCI Console → Compute → Instances** to get the public IP',
                '2. SSH in: `ssh -i ~/.ssh/hetzner_primordial ubuntu@<PUBLIC_IP>`',
                '3. Deploy the stack, verify pipeline runs',
                '4. Point DNS / update CLAUDE.md with new IP',
                '5. Shut down Hetzner node to stop billing',
              ].join('\n'),
              labels: ['infrastructure'],
            });
